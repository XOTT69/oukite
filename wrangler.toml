name = "oukitel-home"
main = "worker.js"
compatibility_date = "2026-09-01"

# Intentionally disabled at user request (2026-10-18).
# Do not enable a workers.dev route or background schedules on deployment.
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
# Explicit [] removes previously deployed cron triggers on the next deploy.
crons = []

[[kv_namespaces]]
binding = "SESSIONS"
id = "e37cddc68d094b5797123329d380cfa0"


# Preferred scalable monitoring storage.
# Create it with:
#   npx wrangler d1 create oukitel-home
# Then paste the returned database_id below and uncomment this block.
# Apply migrations with:
#   npx wrangler d1 migrations apply oukitel-home --remote
#
# [[d1_databases]]
# binding = "DB"
# database_name = "oukitel-home"
# database_id = "PASTE_DATABASE_ID_HERE"
# migrations_dir = "migrations"
